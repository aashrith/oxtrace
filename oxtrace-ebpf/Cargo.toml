[package]
name = "oxtrace-ebpf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Programs that call GPL-only kernel helpers must be GPL-compatible.
license = "MIT OR GPL-2.0"
# Shipped precompiled inside the `oxtrace` crate instead.
publish = false

[dependencies]
oxtrace-common = { workspace = true }

aya-ebpf = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "oxtrace"
path = "src/main.rs"
