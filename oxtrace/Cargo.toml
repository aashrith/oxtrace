[package]
name = "oxtrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Zero-instrumentation observability powered by eBPF and Rust"
repository.workspace = true
readme = "../README.md"
keywords = ["ebpf", "observability", "tracing", "llm", "tls"]
# `bpf/` holds prebuilt eBPF objects; it is gitignored and filled in by the release workflow.
include = ["/src", "/build.rs", "/bpf/*.o"]
categories = ["command-line-utilities", "development-tools::profiling", "network-programming"]

license.workspace = true

[dependencies]
oxtrace-common = { workspace = true }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
prometheus-client = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }
clap = { workspace = true, features = ["derive", "help", "usage", "error-context"] }
[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }

[[bin]]
name = "oxtrace"
path = "src/main.rs"
